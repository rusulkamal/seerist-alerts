  function render() {

    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });
  }

  function jump(i) {
    current = i;
    render();
  }

  const tabsEl = document.getElementById('tabs');
  variants.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = c.tab;
    btn.onclick = () => jump(i);

  });
